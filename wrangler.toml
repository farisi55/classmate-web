name = "classmate-web"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# knowledge.md §8 — Required env vars / bindings.
# Both IDs below are placeholders: create the KV namespace and R2 bucket in the
# Cloudflare dashboard (or via `wrangler kv namespace create` / `wrangler r2 bucket
# create`) first, then paste the real IDs here — see README.md "Deploy" section.

[[kv_namespaces]]
binding = "CLASSMATE_KV"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "CLASSMATE_ASSETS"
bucket_name = "classmate-assets"
