name = "classmate-web"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

[assets]
directory = "./dist"

# Manual Pages fallback:
#   npm run deploy
#   npx wrangler pages deploy dist
# For the current deploy configuration, `npx wrangler deploy` will now use dist as assets source.

# knowledge.md §8 — Required env vars / bindings.
# The id below is a placeholder: create the KV namespace in the Cloudflare
# dashboard (or via `wrangler kv namespace create`) first, then paste the
# real id here — see README.md "Deploy" section.
#
# R2 (CLASSMATE_ASSETS) has been removed — activity photos and client/venue
# logos now ship as static build assets via astro:assets (src/assets/) so
# the whole stack stays on the free tier with no bucket to manage. See
# ASSET_MANIFEST.md and knowledge.md §3 for the current approach.

[[kv_namespaces]]
binding = "CLASSMATE_KV"
id = "87b5fe2bd58c4bb38e82008bfac5cd50"
