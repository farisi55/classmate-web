name: Backup Ticker Messages

on:
  schedule:
    # Daily at 0 19 * * * UTC = 02:00 WIB
    - cron: '0 19 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch ticker data
        id: fetch
        run: |
          mkdir -p backups
          RESPONSE=$(curl -s --max-time 60 -w "\n%{http_code}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            "https://classmate.co.id/api/admin/ticker-export")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Failed to fetch ticker data (HTTP $HTTP_CODE)"
            exit 1
          fi

          # Extract data field from { data, error } envelope
          echo "$BODY" | jq -r '.data' > backups/ticker-messages.json
          echo "fetched=true" >> $GITHUB_OUTPUT

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add backups/ticker-messages.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "backup(ticker): update ticker messages snapshot"
            git push
          fi
